# Custom secret-detection rules.
#
# Trivy's built-in ruleset scanned this repository clean while a live Telegram
# bot token sat in supabase/migrations/20251213115718_add_settings_table.sql.
# A scanner that misses your actual leak is worse than no scanner, because it
# produces confidence rather than doubt.
#
# The private-key rule is deliberately ANCHORED to an adjacent identifier. A
# first version matched any 64-hex-char string and immediately flagged this
# repository's own SHA-256 migration checksums. A scanner that cries wolf gets
# switched off, which is the worst outcome of all.
#
# Both rules were verified to fire against synthetic bait before being adopted.

rules:
  - id: telegram-bot-token
    category: Telegram
    title: Telegram Bot API token
    severity: CRITICAL
    regex: \b[0-9]{8,12}:[A-Za-z0-9_-]{35}\b
    keywords:
      - ":AA"

  - id: evm-private-key
    category: Blockchain
    title: EVM/BSC private key
    severity: CRITICAL
    # Anchored to a private-key identifier so ordinary 64-hex values --
    # checksums, hashes, transaction ids -- do not match. The separator class
    # excludes hex characters so it cannot swallow the key itself.
    regex: (?i)private[_-]?key[^a-zA-Z0-9]{1,12}(0x)?[a-fA-F0-9]{64}
    keywords:
      - privatekey
      - private_key
      - private-key
