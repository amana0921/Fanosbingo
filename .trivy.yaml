# Trivy config scanning for the Terraform in infra/.
#
# Every entry below is a deliberate architectural decision documented in
# infra/README.md and in the module that makes it — not an unreviewed
# suppression. Anything not listed here should fail the build.

misconfiguration:
  terraform:
    exclude-downloaded-modules: true

  # Findings accepted with reasons:
  #
  # AVD-AWS-0104  Security group allows egress to 0.0.0.0/0
  #   There is no NAT Gateway (a deliberate ~$32/mo saving). The instance must
  #   reach BSC RPC providers, the Telegram Bot API, ECR and SSM directly.
  #   Restricting egress would require the NAT we are avoiding.
  #
  # AVD-AWS-0130  EC2 instance in a public subnet
  #   Same reason. Inbound is locked to Cloudflare's published ranges, which is
  #   what makes this safe and is what lets us skip an ALB and AWS WAF.
  #
  # AVD-AWS-0176  IMDS hop limit greater than 1
  #   Set to 2 so containers can reach the instance metadata service. IMDSv2 is
  #   required (http_tokens = "required"), which is the control that matters.
  #
  # AVD-AWS-0176 / AVD-AWS-0080  RDS is not Multi-AZ
  #   Accepted at Stage 1 and stated plainly in the plan: single-AZ with 7-day
  #   PITR, ~25 minute RTO. Multi-AZ is the first Stage 2 upgrade.
  #
  # AVD-AWS-0057  IAM policy with wildcard resources
  #   Confined to actions that genuinely do not support resource-level scoping
  #   (ecr:GetAuthorizationToken, cloudwatch:PutMetricData, ec2:Describe*).
  #   Where scoping IS supported, it is applied.

secret:
  # Scan for committed credentials too. A private key in this repository is
  # exactly how the previous hot wallet was compromised.
  enabled: true
