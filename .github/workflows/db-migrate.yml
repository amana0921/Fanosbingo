name: Database migrations

# Applies schema changes to RDS through an SSM tunnel.
#
# RDS has no public endpoint, which is correct for a database holding player
# balances, and means CI cannot reach it directly. Rather than weaken that by
# making the instance publicly accessible or standing up a bastion, this tunnels
# through the existing ECS container instance via SSM: no inbound port, no SSH
# key, and every session attributable to an IAM principal in CloudTrail.
#
# A pull request touching migrations gets a DRY RUN showing exactly what would
# be applied. Applying is deliberate: either merged to main, or dispatched.

on:
  pull_request:
    paths:
      - 'db/**'
      - 'supabase/migrations/**'
      - 'scripts/db-*.sh'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to migrate'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      dry_run:
        description: 'List pending migrations without applying'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  migrate:
    name: Migrate (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    concurrency:
      # Two concurrent runners applying migrations to one database is a genuine
      # corruption risk, not merely wasteful.
      group: db-migrate-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      # An unset AWS_ACCOUNT_ID builds "arn:aws:iam:::role/...", which
      # configure-aws-credentials retries against for ninety seconds before
      # reporting "Request ARN is invalid" -- a message that points at the ARN
      # rather than at the variable that is missing. Fail in two seconds instead,
      # and say what to run.
      - name: Check the repository is bootstrapped
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID is not set, so the deploy role ARN cannot be built. Run ./scripts/bootstrap-github.sh."
            exit 1
          fi

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The scoped per-environment deploy role, not the AdministratorAccess
          # Terraform executor. This job runs on PULL REQUESTS for the dry run,
          # which means it runs workflow code from the PR branch -- exactly the
          # situation where an admin credential should not be present.
          #
          # A pull request can only ever reach the DEV role: obtaining the prod
          # one requires declaring `environment: prod`, which puts the job behind
          # prod's required reviewers.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fanosbingo-${{ github.event.inputs.environment || 'dev' }}-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: db-migrate-${{ github.run_id }}

      - name: Install session-manager-plugin
        run: |
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Verify psql
        run: psql --version

      - name: Run migrations
        env:
          # PostgREST connects as `authenticator`. The bootstrap file sets this
          # role's password, so the runner needs it. Read from SSM at run time
          # rather than passed as a workflow input, so it never appears in logs
          # or run metadata.
          DRY_RUN_FLAG: ${{ github.event_name == 'pull_request' && '--dry-run' || (github.event.inputs.dry_run == 'true' && '--dry-run' || '') }}
        run: |
          set -euo pipefail

          DB_AUTHENTICATOR_PASSWORD="$(aws ssm get-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/db/postgrest_password" \
            --with-decryption --query 'Parameter.Value' --output text)"
          export DB_AUTHENTICATOR_PASSWORD

          # app_service is the login role the ticker and functions containers
          # use; it inherits service_role, unlike authenticator.
          DB_APP_PASSWORD="$(aws ssm get-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/db/app_password" \
            --with-decryption --query 'Parameter.Value' --output text)"
          export DB_APP_PASSWORD

          for v in DB_AUTHENTICATOR_PASSWORD DB_APP_PASSWORD; do
            if [ "${!v}" = "PLACEHOLDER_SET_ME_OUT_OF_BAND" ]; then
              echo "::error::$v is still a placeholder. Run the 'Sync secrets to SSM' workflow first."
              exit 1
            fi
          done

          # shellcheck disable=SC1091
          source scripts/db-tunnel.sh "$ENVIRONMENT"
          trap stop_db_tunnel EXIT

          ./scripts/db-migrate.sh $DRY_RUN_FLAG | tee /tmp/migrate-output.txt

      # One tunnel for every check. Each `source db-tunnel.sh` opens a separate
      # SSM session, and a just-closed session can still hold its local port,
      # which presents as a confusing "tunnel did not become ready".
      - name: Verify database state and game loop
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/db-tunnel.sh "$ENVIRONMENT"
          trap stop_db_tunnel EXIT

          echo "### Database state" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # These four are the difference between Realtime working and Realtime
          # connecting successfully while delivering nothing.
          psql "$DATABASE_URL" --no-psqlrc -tAc "
            SELECT 'wal_level              = ' || current_setting('wal_level')
            UNION ALL SELECT 'shared_preload_libs    = ' || current_setting('shared_preload_libraries')
            UNION ALL SELECT 'publication tables     = ' || coalesce((
              SELECT string_agg(tablename, ', ' ORDER BY tablename)
              FROM pg_publication_tables WHERE pubname = 'supabase_realtime'), '(none)')
            UNION ALL SELECT 'cron jobs              = ' || coalesce((
              SELECT string_agg(jobname || ' [' || schedule || ']', ', ' ORDER BY jobname)
              FROM cron.job), '(none)')
            UNION ALL SELECT 'tables in public       = ' || (
              SELECT count(*)::text FROM information_schema.tables
              WHERE table_schema = 'public' AND table_type = 'BASE TABLE')
            UNION ALL SELECT 'migrations applied     = ' || (
              SELECT count(*)::text FROM schema_migrations)
          " | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # --- Game loop smoke test, on the SAME tunnel -----------------------
          echo "### Game loop smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Exercise game_tick for real rather than trusting that it compiles.
          # First call should create a waiting game if none exists; the second
          # must NOT create a duplicate, which is the property that used to be
          # violated by two browsers racing to create one.
          #
          # Output is captured with 2>&1 and printed explicitly. Piping psql
          # straight into sed under `set -e` loses the error text, which turns a
          # one-line "function does not exist" into a silent exit code 1.
          run_tick() {
            local label="$1" out
            if ! out="$(psql "$DATABASE_URL" --no-psqlrc -tAc 'SELECT game_tick()' 2>&1)"; then
              echo "::error::${label} failed"
              echo "$out"
              return 1
            fi
            echo "${label}: ${out}" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          run_tick "tick 1"
          run_tick "tick 2"

          if ! waiting="$(psql "$DATABASE_URL" --no-psqlrc -tAc \
              "SELECT count(*) FROM games WHERE status = 'waiting'" 2>&1)"; then
            echo "::error::Could not count waiting games"
            echo "$waiting"
            exit 1
          fi

          echo "waiting games: $waiting" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$waiting" != "1" ]; then
            echo "::error::Expected exactly 1 waiting game after two ticks, found $waiting."
            exit 1
          fi

      # Probe the LIVE endpoint anonymously after any schema change.
      #
      # A permissive RLS policy is not visible in a migration diff -- the
      # settings exposure that leaked a live bot token was found by curl, and
      # the first fix for it reported success while changing nothing. This runs
      # that probe automatically so the next one fails a build instead of
      # waiting to be noticed.
      #
      # Tests the whole chain (Cloudflare -> Caddy -> PostgREST -> RLS), which
      # the migration-time SET ROLE anon assertions deliberately do not.
      - name: Probe public access
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        run: |
          BASE="https://api.${{ vars.DOMAIN_NAME }}"
          if ! curl -sf -m 15 -o /dev/null "$BASE/healthz"; then
            echo "::warning::$BASE is not reachable; skipping the public-access probe."
            echo "(The endpoint may be scaled to zero. The probe cannot conclude anything.)"
            exit 0
          fi
          ./scripts/probe-public-access.sh "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment dry run on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/migrate-output.txt', 'utf8');
            const body = [
              '### Pending database migrations — `dev`',
              '',
              '```',
              out.replace(/\u001b\[[0-9;]*m/g, '').slice(-60000),
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Pending database migrations'));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
