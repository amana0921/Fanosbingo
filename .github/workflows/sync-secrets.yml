name: Sync secrets to SSM

# Terraform creates every SecureString parameter with a placeholder and then
# deliberately ignores its value, so that real secrets never enter Terraform
# state — state is plaintext JSON sitting in S3.
#
# This workflow is how the real values get there: GitHub Secrets (encrypted at
# rest, never printed) are pushed into SSM Parameter Store. Rotating a secret
# becomes "update the GitHub Secret, re-run this workflow", with no shell
# history and nobody handling the value directly.
#
# Run it after the first `terraform apply`, and again whenever a secret rotates.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to sync'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-secrets-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sync-secrets-${{ github.run_id }}

      - name: Push secrets to Parameter Store
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          # Map of SSM path suffix -> GitHub Secret. A secret that is unset is
          # skipped with a warning rather than written as an empty string, which
          # would look populated while breaking whatever reads it.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_ADMIN_BOOTSTRAP_KEY: ${{ secrets.APP_ADMIN_BOOTSTRAP_KEY }}
          DB_POSTGREST_PASSWORD: ${{ secrets.DB_POSTGREST_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          REALTIME_SECRET_KEY_BASE: ${{ secrets.REALTIME_SECRET_KEY_BASE }}
          REALTIME_DB_ENC_KEY: ${{ secrets.REALTIME_DB_ENC_KEY }}
        run: |
          set -euo pipefail
          PREFIX="/fanosbingo-${ENVIRONMENT}"
          KEY_ALIAS="alias/fanosbingo-${ENVIRONMENT}-main"

          # ssm_path:env_var_name
          MAPPINGS="
          telegram/bot_token:TELEGRAM_BOT_TOKEN
          telegram/webhook_secret:TELEGRAM_WEBHOOK_SECRET
          app/jwt_secret:APP_JWT_SECRET
          app/admin_bootstrap_key:APP_ADMIN_BOOTSTRAP_KEY
          db/postgrest_password:DB_POSTGREST_PASSWORD
          db/app_password:DB_APP_PASSWORD
          realtime/secret_key_base:REALTIME_SECRET_KEY_BASE
          realtime/db_enc_key:REALTIME_DB_ENC_KEY
          "

          synced=0; skipped=0
          for mapping in $MAPPINGS; do
            [ -n "$mapping" ] || continue
            ssm_path="${mapping%%:*}"
            var_name="${mapping##*:}"
            value="${!var_name:-}"

            if [ -z "$value" ]; then
              echo "::warning::GitHub Secret $var_name is not set — skipping ${PREFIX}/${ssm_path}"
              skipped=$((skipped + 1))
              continue
            fi

            # --value is read from a variable, never echoed. AWS CLI does not log it.
            aws ssm put-parameter \
              --name "${PREFIX}/${ssm_path}" \
              --type SecureString \
              --key-id "$KEY_ALIAS" \
              --value "$value" \
              --overwrite \
              --no-cli-pager > /dev/null

            echo "synced ${PREFIX}/${ssm_path}"
            synced=$((synced + 1))
          done

          echo "SYNCED=$synced" >> "$GITHUB_ENV"
          echo "SKIPPED=$skipped" >> "$GITHUB_ENV"

      - name: Verify no placeholders remain
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          PREFIX="/fanosbingo-${ENVIRONMENT}"

          # A parameter still holding the Terraform placeholder is worse than a
          # missing one: it looks configured and fails at runtime instead.
          remaining=$(aws ssm get-parameters-by-path \
            --path "$PREFIX" --recursive --with-decryption \
            --query "Parameters[?Value=='PLACEHOLDER_SET_ME_OUT_OF_BAND'].Name" \
            --output text)

          {
            echo "### Secret sync — ${ENVIRONMENT}"
            echo
            echo "- Synced: ${SYNCED}"
            echo "- Skipped (GitHub Secret unset): ${SKIPPED}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$remaining" ]; then
            {
              echo
              echo "**Still holding placeholders:**"
              echo '```'
              echo "$remaining" | tr '\t' '\n'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Parameters still contain the placeholder value. Set the corresponding GitHub Secrets and re-run."
            exit 1
          fi

          echo "All parameters populated." >> "$GITHUB_STEP_SUMMARY"
